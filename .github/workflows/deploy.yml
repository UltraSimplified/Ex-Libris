name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: Run the waiting database migrations on staging and live
        type: boolean
        default: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'
  PHP_EXTENSIONS: bcmath, gd, intl, pdo_sqlite, sockets, zip
  # {"http-basic":{"nova.laravel.com":{"username":"...","password":"..."}}}
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan vendor:publish --tag=cookies-consent-public --no-interaction

      - name: Build the front end
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check formatting
        run: composer test:lint

      - name: Static analysis
        run: composer analyse

      - name: Feature and unit tests
        run: php artisan test tests/Feature tests/Unit --compact

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: php artisan test tests/Browser --compact

  # Each stays off until its repository variable is set to true. Live also needs
  # staging to have gone through, so a release that breaks there stops there.
  staging:
    needs: test
    if: vars.DEPLOY_STAGING_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-to.yml
    with:
      environment: staging
      url: https://staging.goodonpaper.info/
      migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate }}
    secrets: inherit

  live:
    needs: staging
    if: vars.DEPLOY_LIVE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-to.yml
    with:
      environment: production
      url: https://www.goodonpaper.info/
      migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate }}
    secrets: inherit
